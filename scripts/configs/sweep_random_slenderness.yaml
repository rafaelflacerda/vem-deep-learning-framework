program: scripts/run_for_sweep.py
method: bayes
metric:
  name: val_loss
  goal: minimize

parameters:
  # =============================================================================
  # DATA
  # =============================================================================
  data.sampling_method:
    value: Sobol

  data.dataset_size:
    value: 2500

  data.val_split:
    value: 0.30

  data.scaler_type:
    value: minmax

  data.rho_folder:
    value: "slenderness_method"

  # =============================================================================
  # MODEL
  # =============================================================================
  model.input_dim:
    value: 9

  model.output_dim:
    value: 1

  model.use_layer_norm:
    value: True

  model.activation:
    values: ["gelu", "silu"]

  model.num_layers:
    values: [3, 4, 5, 6, 7, 8]

  model.hidden_dim:
    values: [64, 96, 128, 192, 256]

  model.dropout:
    distribution: uniform
    min: 0.01
    max: 0.30

  # =============================================================================
  # TRAINING
  # =============================================================================
  training.epochs:
    value: 250

  training.batch_size:
    values: [128, 256, 512, 1024]

  training.learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01

  training.weight_decay:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-3

  training.loss_type:
    value: huber

  training.huber_delta:
    distribution: uniform
    min: 0.5
    max: 1.5

  # --- optimizer (existe no ExperimentConfig.py) ---
  training.optimizer_type:
    value: adamw

  # AdamW params (existem no ExperimentConfig.py)
  training.adamw_beta1:
    value: 0.9

  training.adamw_beta2:
    value: 0.999

  training.adamw_epsilon:
    value: 1e-8

  # --- scheduler (existe no ExperimentConfig.py) ---
  training.scheduler_type:
    value: reduce_lr_on_plateau

  # Parâmetros do scheduler
  training.scheduler_patience:
    values: [10, 20]

  training.scheduler_factor:
    values: [0.1, 0.5, 0.9]

  # Parâmetros de schedulers alternativos (existem no ExperimentConfig.py) - fixos
  training.scheduler_t_max:
    value: 100

  training.scheduler_step_size:
    value: 10

  # =============================================================================
  # EVALUATION
  # =============================================================================
  evaluation.mc_samples:
    value: 50

  evaluation.n_profile_samples:
    value: 6

  # =============================================================================
  # CV
  # =============================================================================
  cv_mode:
    value: fixed

