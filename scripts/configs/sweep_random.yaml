# Configuração de Sweep para comparação de scalers com SGD
# Objetivo: encontrar melhor combinação de scaler + hiperparâmetros SGD
# Método: Bayesian optimization para explorar eficientemente o espaço

program: scripts/run_for_sweep.py
method: bayes
metric:
  name: val_loss
  goal: minimize

parameters:
  # Ativação (2 opções)
  model.activation:
    values: ["gelu"]
  
  # Learning rate (contínuo, em escala log)
  training.learning_rate:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.002
  
  # Número de camadas (discreto)
  model.num_layers:
    values: [10, 11, 12]
  
  # Dropout (discreto)
  model.dropout:
    distribution: uniform
    min: 0.06
    max: 0.12
  
  # Hidden dimension (discreto)
  model.hidden_dim:
    values: [64, 80, 96, 112, 128, 160, 192, 224, 256]

  # Loss type (2 opções)
  
  training.huber_delta:
    distribution: uniform
    min: 0.4
    max: 1.2

  # Scheduler factor (para ReduceLROnPlateau)
  training.scheduler_factor:
    distribution: uniform
    min: 0.7
    max: 0.9
  
  # Scheduler patience
  training.scheduler_patience:
    values: [20, 25, 30]
  
  # AdamW beta1
  training.adamw_beta1:
    distribution: uniform
    min: 0.930
    max: 0.999
  
  # AdamW beta2
  training.adamw_beta2:
    distribution: uniform
    min: 0.980
    max: 0.999
  
  # AdamW epsilon
  training.adamw_epsilon:
    distribution: log_uniform_values
    min: 5.0e-10
    max: 5.0e-7

  cv_mode:
    values: ["fixed"]

  training.batch_size:
    values: [1024, 2048]

  training.weight_decay:
    distribution: log_uniform_values
    min: 0.00000050
    max: 0.00050000
