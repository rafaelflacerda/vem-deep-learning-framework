# Configuração de Sweep para comparação de scalers com SGD
# Objetivo: encontrar melhor combinação de scaler + hiperparâmetros SGD
# Método: Bayesian optimization para explorar eficientemente o espaço

program: scripts/run_for_sweep.py
method: bayes
metric:
  name: val_loss
  goal: minimize

parameters:
  # Ativação (2 opções)
  model.activation:
    values: ["silu", "gelu"]
  
  # Learning rate (contínuo, em escala log)
  training.learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  
  # Número de camadas (discreto)
  model.num_layers:
    values: [9, 10, 11, 12]
  
  # Dropout (discreto)
  model.dropout:
    min: 0.05
    max: 0.10
  
  # Hidden dimension (discreto)
  model.hidden_dim:
    values: [32, 48, 64, 80, 96, 112, 128, 160, 192, 224, 256]

  # Loss type (2 opções)
  
  training.huber_delta:
    min: 0.5
    max: 1.5

  # Scheduler factor (para ReduceLROnPlateau)
  training.scheduler_factor:
    min: 0.5
    max: 0.9
  
  # Scheduler patience
  training.scheduler_patience:
    values: [10, 15, 20, 25, 30]
  
  # AdamW beta1
  training.adamw_beta1:
    min: 0.95
    max: 0.99
  
  # AdamW beta2
  training.adamw_beta2:
    min: 0.990
    max: 0.995
  
  # AdamW epsilon
  training.adamw_epsilon:
    distribution: log_uniform_values
    min: 1.0e-9
    max: 1.0e-6

  cv_mode:
    values: ["fixed", "kfold"]

  n_folds:
    values: [5, 10]

  training.batch_size:
    values: [128, 256, 512, 1024]

  training.weight_decay:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3