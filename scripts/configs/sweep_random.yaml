# Método: Bayesian optimization para explorar eficientemente o espaço

program: scripts/run_for_sweep.py
method: random
metric:
  name: val_loss
  goal: minimize

parameters:
  # Ativação (2 opções)
  model.activation:
    values: ["gelu", "silu"]
  
  # Learning rate (contínuo, em escala log)
  training.learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.005
  
  # Número de camadas (discreto)
  model.num_layers:
    values: [4, 5, 6, 7, 8, 9, 10, 11, 12]
  
  # Dropout (discreto)
  model.dropout:
    distribution: uniform
    min: 0.05
    max: 0.20
  
  # Hidden dimension (discreto)
  model.hidden_dim:
    values: [48, 64, 96, 128, 192, 256]

  # Loss type (2 opções)
  
  training.huber_delta:
    distribution: uniform
    min: 0.3
    max: 1.5

  # Scheduler factor (para ReduceLROnPlateau)
  training.scheduler_factor:
    distribution: uniform
    min: 0.5
    max: 0.9
  
  # Scheduler patience
  training.scheduler_patience:
    values: [15, 20, 25, 30]
  
  # AdamW beta1
  training.adamw_beta1:
    distribution: uniform
    min: 0.850
    max: 0.999
  
  # AdamW beta2
  training.adamw_beta2:
    distribution: uniform
    min: 0.970
    max: 0.999
  
  # AdamW epsilon
  training.adamw_epsilon:
    distribution: log_uniform_values
    min: 5.0e-10
    max: 5.0e-6

  cv_mode:
    values: ["fixed"]

  training.batch_size:
    values: [256, 512, 1024, 2048, 4096]

  training.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.001
